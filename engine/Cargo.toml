[package]
name = "flowbench-engine"
version = "0.1.0"
edition = "2021"
# io::ErrorKind::HostUnreachable / NetworkUnreachable / NetworkDown
rust-version = "1.83"
description = "FlowBench native load-generation engine (stdin/stdout JSON protocol)"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "flowbench-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "time", "io-std", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
